<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- flexbox:(flexible-box) is a 1D layout model (align items and place them in a container). -->

    <!-- Parent container = flex container -->
    <!-- flex items = children of flex container -->
    <!-- horizontal axis = main axis -->
    <!-- vertical axis = cross axis -->
    <!-- to create a container as flex just do display: flex; -->

    <style>
      .container {
        background-color: beige;
        height: 500px;
        border: 5px solid black;
        margin: 2px;
        padding: 2px;
        display: flex;
        flex-direction: row;
        /* flex-wrap: wrap; */
        justify-content: start;
        align-items: start;
        align-content: start;

        /* whenever we use flex, than by default flex-direction is row */

        /* flex-direction: row-reverse; */
        /* it will reverse the order of the flex items in a row */

        /* flex-direction can have values: row, row-reverse, column, column-reverse
        row: here flex items will be alligned in a row in same order
        
        row-reverse: here flex items will be alligned in a row in reverse order from right to left

        column: here flex items will be alligned in a column in same order from top to bottom

        column-reverse: here flex items will be alligned in a column in reverse order from bottom to top
        
        */

        /* if we zoom out our screen than the flex items will shrink to fit the container */

        /* flex-wrap: wrap; this will allow flex items to wrap onto multiple lines maitaining their original size*/

        /* flex-wrap: nowrap; this will prevent flex items from wrapping and they will stay in a single line */

        /* flex-wrap: wrap-reverse; this will allow flex items to wrap onto multiple lines in reverse order  means first item will go on next line first if i do zooming out container instead of last container*/

        /* if flex-drection is row than main axis is row and if flex-direction is column than main axis is column */

        /* justify-content:space-around; this will distribute the flex items with space around them (space at left and right of each item) */

        /* justify-content: space-between; this will distribute the flex items with space between them (no space at the ends) */

        /* justify-content: space-evenly; this will distribute the flex items with equal space around them */

        /* justify-content: center; this will center the flex items along the main axis */

        /* justify-content: start; this will align the flex items at the start of the main axis */

        /* justify-content: end; this will align the flex items at the end of the main axis */

        /* align-items will work corresponding to their cross axis */

        /* align-items: center; this will center the flex items along the cross axis */
        /* align-items: start; this will align the flex items at the start of the cross axis */

        /* align-items: end; this will align the flex items at the end of the cross axis */

        /* align-items: stretch; this will stretch the flex items to fill the container along the cross axis */

        /* justify-content: center;
        align-items: center; this both together will keep flex items centered both horizontally and vertically */

        /* align content is used to align flex lines within a flex container when there is extra space in the cross axis */
      }

      .box {
        height: 200px;
        width: 200px;
        border: 2px solid brown;
        margin: 2px;
        padding: 2px;
      }

      #box1 {
        background-color: aqua;
        order: 500;
        flex-grow: 1;
        /* order property is used to control the order in which flex items appear within a flex container. more value means it will appear later */
      }

      #box2 {
        background-color: coral;
        flex-grow: 1;
      }

      #box3 {
        background-color: lightgreen;
        flex-shrink: 2;
        /* flex-shrink property specifies the flex shrink factor of a flex item.
         means about how much the item will shrink relative to the rest of the flex items when there is not enough space */
        flex-grow: 1;

        flex-basis: 400px;
        /* flex-basis property specifies the initial main size of a flex item before any remaining space is distributed */
      }

      #box4 {
        background-color: lightpink;
        order: -100;
        flex-grow: 5;
        /* flex-grow property specifies the flex grow factor of a flex item.
         means about how much the item will grow relative to the rest of the flex items when there is extra space */
      }

      /* short hand notation of flex
      flex: flex-grow flex-shrink flex-basis;
      1. flex-grow: it defines the ability for a flex item to grow if necessary

      2. flex-shrink: it defines the ability for a flex item to shrink if necessary

      3. flex-basis: it defines the default size of an element before the remaining space is distributed
      */

      .con1 {
        background-color: rgb(209, 232, 76);
        height: 500px;
        border: 5px solid black;
        margin: 2px;
        padding: 2px;
        display: flex;
        /* justify-content: center;
        align-items: center;
        align-content: center; */
      }
      .box1 {
        height: 200px;
        width: 200px;
        border: 2px solid brown;
        margin: 2px;
        padding: 2px;
      }
      #b1 {
        background-color: darkslategrey;
        align-self: center;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box" id="box1">Box1</div>
      <div class="box" id="box2">Box2</div>
      <div class="box" id="box3">Box3</div>
      <div class="box" id="box4">Box4</div>
    </div>

    <div class="con1">
      <div class="box1" id="b1">Box1</div>
      <div class="box1" id="b2">Box2</div>
      <div class="box1" id="b3">Box3</div>
      <div class="box1" id="b4">Box4</div>
    </div>
  </body>
</html>
