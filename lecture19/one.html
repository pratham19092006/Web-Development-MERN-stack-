<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .box {
        border: 2px solid black;
        /* when content overflows the parent boxes than we use overflow */
        /* overflow : it contains floated children and will prevent from collapsing the parent container*/
        overflow: auto;
        /* auto means the browser will decide whether to add scrollbars or not */
      }

      .item {
        width: 200px;
        height: 200px;
        margin: 2px;
        background-color: lightblue;
        border: 2px solid black;
        float: left;
      }
      #item1 {
        float: right;
      }

      #item2 {
        float: right;
        clear: right;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="item" id="item1">A</div>
      <div class="item" id="item2">B</div>
      <div class="item" id="item3">C</div>
    </div>
  </body>
</html>
