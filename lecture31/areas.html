<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid template areas</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100%;
        height: 100%;
      }
      .container {
        width: 100%;
        height: 100%;
        padding: 4rem;
        display: grid;
        gap: 1rem;
        background-color: rgb(105, 96, 96);

        /* gread-template-areas is used to create a grid layout by defining named areas for the grid items. It allows you to specify the layout of the grid items in a more intuitive way by using names instead of grid lines. Each area is defined by a string of characters, where each character represents a grid item. The grid-template-areas property is used in conjunction with the grid-area property, which is applied to individual grid items to assign them to the defined areas.
         */

        grid-template-areas:
          "header header header"
          "sidebar content1 content1"
          "sidebar content2 content3"
          "footer footer footer";
      }
      .item {
        padding: 1rem;
        border: 2px solid black;
        background-color: rgb(78, 78, 159);
        color: white;
      }
      #header {
        grid-area: header;
      }
      #sidebar {
        grid-area: sidebar;
      }
      #content1 {
        grid-area: content1;
      }
      #content2 {
        grid-area: content2;
      }
      #content3 {
        grid-area: content3;
      }
      #footer {
        grid-area: footer;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item" id="header">Header</div>
      <div class="item" id="sidebar">Sidebar</div>
      <div class="item" id="content1">Content1</div>
      <div class="item" id="content2">Content2</div>
      <div class="item" id="content3">Content3</div>
      <div class="item" id="footer">Footer</div>
    </div>
  </body>
</html>
