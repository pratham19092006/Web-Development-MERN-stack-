<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive grid design</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        width: 100%;
        height: 100%;
        padding: 4rem;
        display: grid;
        gap: 1rem;
        background-color: rgb(105, 96, 96);
        /* grid-template-columns: repeat(3, 1fr); */

        /* below line will fit grid items automatically according to view width and min width will be 200px and maximim width will be 1fr */
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));

        /* if there is auto-fill instead of auto-fit than it will create empty columns to fill the available space */
      }
      .item {
        padding: 1rem;
        border: 5px solid black;
        background-color: rgb(78, 78, 159);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item">A</div>
      <div class="item">B</div>
      <div class="item">C</div>
      <div class="item">D</div>
      <div class="item">E</div>
      <div class="item">F</div>
      <div class="item">G</div>
      <div class="item">H</div>
      <div class="item">I</div>
      <div class="item">J</div>
      <div class="item">K</div>
      <!-- <div class="item">L</div>
      <div class="item">M</div>
      <div class="item">N</div>
      <div class="item">O</div>
      <div class="item">P</div> -->
    </div>
  </body>
</html>
