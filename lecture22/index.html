<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- shadow: -->
    <!-- text shadow: this is used to create a shadow effect around text elements like h1, p, etc.  -->

    <!-- box shadow: this is used to create a shadow effect around elements like div, img, etc. -->

    <style>
      :root {
        --primary-color: brown;
        --custom-width: 330px;
      }
      .container {
        background-color: beige;
        height: 650px;
        border: 2px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box {
        --custom-width: 330px;
        background-color: aquamarine;
        width: var(--custom-width);
        height: 330px;
        border: 4px solid var(--primary-color);
        margin: 5px;
        padding: 5px;

        /* --primary-color: brown; */
        /* --custom-width: 330px; */
        /* CSS Variables: these are used to store values that can be reused throughout the stylesheet. They are defined using the -- prefix and accessed using the var() function. Currently they can only be accessed inside the selector where they are defined .
        If we define them inside :root selector, they can be accessed globally throughout the stylesheet.
        */

        /* box-shadow: 20px 10px brown; */
        /* box-shadow: horizontal-offset ,vertical-offset, color;(negative value means negative direction) */

        /* box-shadow: 25px 20px 40px brown; */
        /* box-shadow: horizontal-offset ,vertical-offset, blur-radius, color;(blur-radius will create a blur effect) */

        /* box-shadow: 25px 20px 40px 25px brown; */
        /* box-shadow: horizontal-offset ,vertical-offset, blur-radius, spread-radius, color;(spread-radius will increase the size of shadow) */

        /* box-shadow: inset 25px 20px brown; */
        /* inset keyword will create shadow inside the element */

        box-shadow:
          20px 10px brown,
          30px 13px green;
        /* multiple shadows can be applied by separating them with a comma */

        /* ------------------------------------- */

        /* text-shadow

        here only spread-radius is not applicable as like box-shadow we have only 3 values for text-shadow
        */
      }
      img {
        width: 70px;
      }
      #head1 {
        /* text-shadow: 13px 3px 0px #f5f3f3; */
        /* text-shadow: horizontal-offset, vertical-offset, blur-radius, color; */

        /* text-shadow: yellow 12px 13px 2px; */
        /* we can also specify the color first */

        /* text-shadow: white 12px 13px; */
        /* blur-radius is optional */

        /* text-shadow: 12px 13px; */
        /* default shadow color is black */

        text-shadow:
          12px 13px white,
          -12px -13px yellow;
        /* here if we apply  two shadows, they will be layered on top of each other and two shadows will be visible */
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="box">
        <img src="/lecture22/codehelp logo.webp" alt="logo codehelp!" />
        <h2 id="head1">Welcome to codehelp</h2>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Facilis, ut
          recusandae dolor cum natus quae excepturi quod possimus asperiores?
          Iure amet facere ipsa quia consequuntur dolores asperiores eaque
          laboriosam accusantium!
        </p>
      </div>
    </div>
  </body>
</html>
