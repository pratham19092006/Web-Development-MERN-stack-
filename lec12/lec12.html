<!doctype html>
<html lang="en">
  <head>
    <!-- content inside head will not be visible on the page -->

    <!-- charset=utf-8 means character is mapped with numeric value so that we can display in digital format -->
    <meta charset="UTF-8" />
    <!-- below lines means latest rendering engine will be used , and different visuals of same website will be handled properly -->
    <!-- initial scale means zoom level will be default to 1 or 100%
     and content=width=device-width means content width will be equal to device width -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- generally meta is used for SEO (search engine optimization) that helps  to bring your website on top of search results -->
    <meta
      name="description"
      content="this website aims to create India's best Coders"
    />

    <meta keywords="codehelp, code, programming, coding, development" />
    <!-- ham jo bhi title tag ke andar likhte hain wo browser ke tab me as a title dikhai deta hai -->
    <!-- while adding favicon make sure image root directory ke andar ho -->
    <title>Favicon, Meta, Title etc</title>
    <!-- below line will add a favicon to the browser tab means a small logo with browser tab title -->
    <link rel="stylesheet" href="./codehelp logo.webp" />
    <!-- linking style.css -->
    <link rel="stylesheet" href="./style.css" />
    <!-- linking script.js -->
    <script src="script.js"></script>
  </head>
  <body>
    <h1>Welcome to Codehelp</h1>
    <button>Submit</button>
  </body>
</html>
